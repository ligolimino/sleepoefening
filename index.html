<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <meta name="theme-color" content="#087f8c" />
        <title>Letterlab — sleepoefening</title>
        <meta
            name="description"
            content="Sleepoefening voor NT2 Alfa: ontbrekende letters of woorden naar het juiste vakje slepen."
        />
        <link rel="stylesheet" href="styles.css?v=14" />
		<script src="app.js?v=11" defer></script>
    </head>
    <body>
        <svg class="svg-defs" aria-hidden="true">
            <symbol id="i-speaker" viewBox="-0.75 0 24 24">
                <path d="M11 5 6 9H2v6h4l5 4V5Z" />
                <path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" />
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <path d="M8 5.5v13l10.5-6.5L8 5.5Z" />
            </symbol>
            <symbol id="i-pause" viewBox="0 0 24 24">
                <path d="M8 5v14M16 5v14" />
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="m5 12 4 4L19 6" />
            </symbol>
            <symbol id="i-close" viewBox="0 0 24 24">
                <path d="M18 6 6 18M6 6l12 12" />
            </symbol>
            <symbol id="i-retry" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
            </symbol>
        </svg>

        <main id="app" class="app" aria-live="polite"></main>
 
    </body>
</html>
